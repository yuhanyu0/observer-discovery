name: Validate public artifact
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_artifact.py
      - run: python experiments/observer_discovery_reconstruction.py
      - run: python scripts/check_reconstruction.py
      - run: pytest -q
